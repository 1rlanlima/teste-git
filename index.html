<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Jogo da Memória</h1>
    <div class="timer">Tempo: <span id="time">0</span>s</div>
    <div class="score">Pares encontrados: <span id="pairs-found">0</span></div>
    
    <div id="game-board" class="game-board"></div>
    
    <div class="victory-message" id="victory-message">
        <h2>Parabéns! Você venceu!</h2>
        <p>Seu tempo foi de <span id="final-time"></span> segundos.</p>
        <button onclick="window.location.reload()">Jogar Novamente</button>
    </div>

    <audio id="background-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

    <audio id="victory-sound" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" preload="auto"></audio>
    
    <script src="script.js"></script>
</body>
<body>
    <h1>Qualquer coisa</h1>
    <p>aprendendo a usar git</p>
</body>
</html>
